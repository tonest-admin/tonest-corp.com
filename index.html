<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>TO:NEST 로그인</title>
  <meta name="theme-color" content="#16a7a4">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#f6f9f8;--card:#fff;--line:#dfe8e6;--line2:#edf3f2;
      --text:#172124;--muted:#708083;--primary:#16a7a4;--primary2:#118b89;
      --danger:#dc2626;--success:#15803d;
      --shadow:0 20px 50px rgba(15,45,47,.10);
      --shadow2:0 10px 28px rgba(20,70,68,.07);
      --radius:22px;
      --font:"Pretendard Variable","Pretendard","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:var(--font);color:var(--text)}
    html{
      background:
        radial-gradient(circle at 50% 0%,rgba(30,174,168,.10),transparent 38%),
        linear-gradient(180deg,#fff 0%,var(--bg) 72%,#eef5f3 100%);
    }
    body{background:transparent;-webkit-font-smoothing:antialiased}
    button,input,a{font-family:inherit}
    .wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:clamp(14px,2.6vw,30px)}
    .auth-stack{width:min(100%,440px);display:flex;flex-direction:column;gap:14px}
    .logo-panel{
      position:relative;width:100%;aspect-ratio:1/1;border:1px solid var(--line);
      border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;
      overflow:hidden;box-shadow:var(--shadow2)
    }
    .logo-panel:before{
      content:"";position:absolute;inset:18px;border:1px solid var(--line2);
      border-radius:24px;background:linear-gradient(180deg,#fff,#fbfefd)
    }
    .brand-logo-img{
      position:relative;z-index:1;width:84%;height:84%;
      object-fit:contain;object-position:center;display:block
    }
    .card{
      width:100%;background:rgba(255,255,255,.98);border:1px solid var(--line);
      border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)
    }
    .kicker{margin-bottom:8px;color:var(--primary2);font-size:11px;font-weight:800;letter-spacing:.16em}
    .title{margin:0 0 4px;font-size:29px;line-height:1.1;font-weight:850;letter-spacing:-.04em}
    .subtitle{margin:0 0 15px;color:var(--muted);font-size:12.5px;line-height:1.55;font-weight:600}
    .label{display:flex;justify-content:space-between;margin:10px 0 6px;color:#334345;font-size:12px;font-weight:800}
    input[type=email],input[type=password]{
      width:100%;height:43px;padding:0 13px;border-radius:14px;border:1px solid #cad8d6;
      background:#f8fbfa;color:var(--text);outline:none;font-size:15px;font-weight:700
    }
    input::placeholder{color:#9aa8aa;font-weight:600}
    input:focus{background:#fff;border-color:rgba(22,167,164,.72);box-shadow:0 0 0 3px rgba(22,167,164,.13)}
    .remember-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
    .remember-row{display:flex;align-items:center;gap:7px;color:#536466;font-size:12px;font-weight:700;user-select:none}
    .remember-row input{width:16px;height:16px;margin:0;accent-color:var(--primary)}
    .btn{
      width:100%;height:44px;margin-top:14px;border:1px solid rgba(17,139,137,.2);
      border-radius:14px;background:linear-gradient(180deg,#22b7b2,#16a7a4);
      color:#fff;font-size:15px;font-weight:800;cursor:pointer;
      box-shadow:0 12px 24px rgba(22,167,164,.22);
      display:flex;align-items:center;justify-content:center;text-decoration:none
    }
    .btn:hover{filter:brightness(1.035)}
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.65;cursor:not-allowed}
    .btn.secondary{margin-top:8px;background:#fff;color:var(--primary2);border-color:#cad8d6;box-shadow:none}
    .btn.secondary:hover{background:#f8fbfa;filter:none}
    .status{min-height:18px;margin-top:9px;color:var(--muted);font-size:11.5px;line-height:1.45;white-space:pre-wrap;font-weight:650}
    .status.error{color:var(--danger)} .status.success{color:var(--success)}
    .footer{margin-top:11px;padding-top:11px;border-top:1px solid var(--line2);color:#97a3a4;font-size:10.5px;text-align:center;font-weight:650;letter-spacing:.02em}
    @media(max-width:760px){
      .wrap{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
      .auth-stack{width:min(100%,410px);gap:9px}
      .logo-panel{border-radius:22px}.logo-panel:before{inset:11px;border-radius:16px}
      .brand-logo-img{width:86%;height:86%}
      .card{padding:14px;border-radius:19px}.title{font-size:26px}.subtitle{font-size:11.5px;margin-bottom:10px}
      .label{margin:7px 0 4px;font-size:11.5px}
      input[type=email],input[type=password]{height:39px;border-radius:12px;font-size:14px}
      .btn{height:40px;margin-top:10px;border-radius:12px;font-size:14px}
    }
    @media(max-height:720px){.logo-panel{max-height:42vh}.subtitle{display:none}}
  </style>
</head>
<body>
<div class="wrap">
  <main class="auth-stack">
    <section class="logo-panel" aria-label="TO:NEST">
      <img class="brand-logo-img" src="./logo.png" alt="TO:NEST">
    </section>

    <section class="card">
      <div class="kicker">TO:NEST OPERATIONS</div>
      <h1 class="title">로그인</h1>
      <p class="subtitle">TO:NEST 운영 시스템에 접속합니다.</p>

      <label class="label" for="email">이메일</label>
      <input id="email" type="email" placeholder="name@company.com" autocomplete="username">

      <label class="label" for="password">비밀번호</label>
      <input id="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password">

      <div class="remember-actions">
        <label class="remember-row">
          <input id="rememberEmail" type="checkbox">
          <span>아이디 저장</span>
        </label>
      </div>

      <button class="btn" id="signIn" type="button">로그인</button>
      <a class="btn secondary" href="./signup">회원가입</a>

      <div class="status" id="status" aria-live="polite"></div>
      <div class="footer">THE POWER TO ATTRACT PEOPLE</div>
    </section>
  </main>
</div>

<script>
(() => {
  const AUTH_WORKER_URL = "https://login.tonest-admin.workers.dev";
  const SAVED_EMAIL_KEY = "tonest_saved_login_email";

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const rememberEmail = document.getElementById("rememberEmail");
  const signInBtn = document.getElementById("signIn");
  const status = document.getElementById("status");

  let supabaseClient = null;

  const setStatus = (message, type = "") => {
    status.textContent = message || "";
    status.className = "status" + (type ? " " + type : "");
  };

  function safeNextPath() {
    const params = new URLSearchParams(location.search);
    const next = params.get("next");
    if (!next || !next.startsWith("/") || next.startsWith("//")) return "/home";
    return next;
  }

  async function initSupabase() {
    if (supabaseClient) return supabaseClient;

    const res = await fetch(AUTH_WORKER_URL + "/auth-config", {
      method: "GET",
      cache: "no-store"
    });

    const config = await res.json().catch(() => ({}));

    if (!res.ok || !config.supabaseUrl || !config.supabaseKey) {
      throw new Error(config.message || "로그인 설정을 불러오지 못했습니다.");
    }

    if (!window.supabase?.createClient) {
      throw new Error("Supabase 라이브러리를 불러오지 못했습니다.");
    }

    supabaseClient = window.supabase.createClient(
      config.supabaseUrl,
      config.supabaseKey,
      {
        auth: {
          persistSession: true,
          storage: window.sessionStorage,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    return supabaseClient;
  }

  function profileStatusMessage(profile) {
    switch (profile?.status) {
      case "pending":
        return "관리자 승인 대기 중인 계정입니다.";
      case "suspended":
        return "사용이 정지된 계정입니다. 관리자에게 문의해주세요.";
      case "rejected":
        return "가입 승인이 거절된 계정입니다. 관리자에게 문의해주세요.";
      default:
        return "계정 상태를 확인할 수 없습니다.";
    }
  }

  async function enforceAccountState(client, userId) {
    const { data: profile, error } = await client
      .from("profiles")
      .select("user_id,email,display_name,role,status")
      .eq("user_id", userId)
      .maybeSingle();

    if (error) throw error;

    if (!profile) {
      await client.auth.signOut();
      throw new Error("회원 프로필이 생성되지 않았습니다. 관리자에게 문의해주세요.");
    }

    if (profile.status !== "active") {
      const message = profileStatusMessage(profile);
      await client.auth.signOut();
      throw new Error(message);
    }

    return profile;
  }

  async function signIn() {
    const em = (email.value || "").trim().toLowerCase();
    const pw = password.value || "";

    if (!em) {
      setStatus("이메일을 입력해주세요.", "error");
      email.focus();
      return;
    }

    if (!pw) {
      setStatus("비밀번호를 입력해주세요.", "error");
      password.focus();
      return;
    }

    signInBtn.disabled = true;
    signInBtn.textContent = "로그인 중...";
    setStatus("로그인 중...");

    try {
      const client = await initSupabase();

      const { data, error } = await client.auth.signInWithPassword({
        email: em,
        password: pw
      });

      if (error) throw error;
      if (!data?.user?.id) throw new Error("로그인 사용자 정보를 확인할 수 없습니다.");

      await enforceAccountState(client, data.user.id);

      try {
        if (rememberEmail.checked) {
          localStorage.setItem(SAVED_EMAIL_KEY, em);
        } else {
          localStorage.removeItem(SAVED_EMAIL_KEY);
        }
      } catch {}

      setStatus("로그인 성공", "success");
      location.replace(safeNextPath());
    } catch (err) {
      let message = err?.message || "로그인에 실패했습니다.";
      if (message === "Invalid login credentials") {
        message = "이메일 또는 비밀번호가 올바르지 않습니다.";
      }
      setStatus(message, "error");
    } finally {
      signInBtn.disabled = false;
      signInBtn.textContent = "로그인";
    }
  }

  try {
    const saved = localStorage.getItem(SAVED_EMAIL_KEY) || "";
    if (saved) {
      email.value = saved;
      rememberEmail.checked = true;
    }
  } catch {}

  signInBtn.addEventListener("click", signIn);

  password.addEventListener("keydown", (event) => {
    if (event.key === "Enter") signIn();
  });

  email.addEventListener("keydown", (event) => {
    if (event.key === "Enter") password.focus();
  });

  (async () => {
    try {
      const client = await initSupabase();
      const { data: { session } } = await client.auth.getSession();

      if (!session?.user?.id) return;

      try {
        await enforceAccountState(client, session.user.id);
        location.replace(safeNextPath());
      } catch (err) {
        setStatus(err?.message || String(err), "error");
      }
    } catch (err) {
      setStatus(err?.message || String(err), "error");
    }
  })();
})();
</script>
</body>
</html>
