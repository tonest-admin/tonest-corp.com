name: Import existing TO:NEST route-info Worker source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-route-info.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5fa38cebad5fe848d09511005fccae1c
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import deployed route-info script safely
        run: |
          set -euo pipefail
          curl -sfS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -D /tmp/route-info.headers \
            -o /tmp/route-info.content \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/route-info/content/v2"
          python - <<'PY'
          import re
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          raw=Path('/tmp/route-info.content').read_bytes()
          headers=Path('/tmp/route-info.headers').read_text(errors='replace')
          ct=next((x.split(':',1)[1].strip() for x in headers.splitlines() if x.lower().startswith('content-type:')),'text/javascript')
          if ct.startswith('multipart/'):
              email=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
              parts=[p for p in email.walk() if p.get_filename() and p.get_filename().endswith(('.js','.mjs'))]
              assert len(parts)==1,'Expected exactly one deployed JavaScript module'
              data=parts[0].get_payload(decode=True)
          else:
              data=raw
          source=data.decode('utf-8')
          assert 12000 < len(source) < 150000
          assert 'tonest-route-info-v4-unified-pk' in source
          assert 'async function listRoutes(' in source
          assert 'export default' in source
          # A deployed code copy must never accidentally expose a literal secret
          assert not re.search(r'(?i)(?:sk|sb_secret|eyJ)[A-Za-z0-9_-]{45,}',source),'Potential embedded secret; not committing'
          target=Path('workers/route-info/entry.js')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(source,encoding='utf-8')
          Path('workers/route-info/wrangler.toml').write_text(
            'name = "route-info"\nmain = "entry.js"\ncompatibility_date = "2026-10-02"\nkeep_vars = true\nworkers_dev = true\npreview_urls = false\n\n[observability]\nenabled = true\n',
            encoding='utf-8')
          print('IMPORTED_SOURCE_BYTES:',len(data))
          PY
          node --check workers/route-info/entry.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/route-info/entry.js workers/route-info/wrangler.toml
          git commit -m "chore: preserve existing route-info worker from Cloudflare" || true
          git push origin HEAD:main
