name: Deploy TO:NEST camps mirror worker
on:
  push:
    branches: [main]
    paths:
      - 'workers/coupang-camps/**'
      - 'tests/camps-mirror-write.test.mjs'
      - '.github/workflows/deploy-camps-mirror.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-tonest-camps
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify camp mirror changes and failure handling
        run: node --test tests/camps-mirror-write.test.mjs
      - name: Deploy camps worker with hourly mirror cron
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4'
          command: deploy --config workers/coupang-camps/wrangler.toml --keep-vars
