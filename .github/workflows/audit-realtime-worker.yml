name: Audit TO:NEST realtime worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-realtime-worker.yml', 'tools/audit-realtime-worker.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect deployed collector without modifying it
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python tools/audit-realtime-worker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tonest-collector-audit
          path: .audit/
          retention-days: 3
