name: Deploy TO:NEST META collector
on:
  push:
    branches: [main]
    paths:
      - 'workers/meta-collector/**'
      - '.github/workflows/test-realtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tonest-meta-deploy-main
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check deployed backend
        run: node --check workers/meta-collector/entry.js
      - name: Deploy META worker with existing secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5fa38cebad5fe848d09511005fccae1c
          wranglerVersion: '4.149.0'
          command: deploy --config workers/meta-collector/wrangler.toml --keep-vars
      - name: Check deployed backend version
        run: |
          python - <<'PYVERIFY'
          import json, urllib.request, time
          url='https://meta-direct-poc.tonest-admin.workers.dev/health'
          expected='2026-10-10-chunwoo-all-batch-clean-keepalive'
          for attempt in range(5):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      result=json.load(response)
                  if result.get('version')==expected:
                      print('Deployed:',result.get('version'),'schemaReady:',result.get('schemaReady'))
                      break
              except Exception as error:
                  print('Health check retry:',error)
              time.sleep(5)
          else:
              raise SystemExit('Deployment version did not update')
          PYVERIFY
