name: Deploy TO:NEST login worker

on:
  push:
    branches:
      - main
    paths:
      - "login-worker.js"
      - "login-wrangler.toml"
      - "public/**"
      - ".github/workflows/deploy-login-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tonest-login-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy login worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config login-wrangler.toml --keep-vars
